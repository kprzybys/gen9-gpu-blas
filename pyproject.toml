# Python environment of the library repo (gen9-gpu-blas): uv sync [--group test ...]; nothing is installed as a package
# (lib/gen9blas.py loads lib/libgen9blas.so or GEN9BLAS_LIB). Groups:
#   build    gen_kernels.py (kernel tables; ocloc also needed)       test     lib/test_*.py
#   solver   experiments/solver (OR-Tools scheduling models)         compare  bench/compare (OpenVINO GEMM)
[project]
name = "gen9-gpu-blas"
version = "0.2.0"
description = "BLAS levels 1-3 and NN ops on Intel Gen9 iGPUs (Python wrapper and tooling)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[dependency-groups]
build = ["pyyaml>=6"]
test = ["scipy>=1.10"]
solver = ["ortools>=9.8"]
compare = ["openvino>=2024.4"]

[tool.uv]
package = false
default-groups = ["build", "test"]
